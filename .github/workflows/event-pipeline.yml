name: DOLPHIN Content Pipeline

on:
  pull_request:
    paths:
      - 'data/events.json'
      - 'data/flyer_verifications.json'
      - 'data/website_image_baseline.json'
      - 'data/october_kiraku_migration.json'
      - 'data/publication_tombstones.json'
      - 'data/social_publications.json'
      - 'automation/publication_guard.py'
      - 'automation/audit_rendered_publication.py'
      - 'automation/social_package.py'
      - 'automation/config.json'
      - 'automation/import_legacy_events.py'
      - 'flyer_*'
      - 'data/artists.json'
      - 'data/operations.json'
      - 'assets/flyers/**'
      - 'assets/brand/**'
      - 'brand-monochrome.css'
      - 'artists/**'
      - 'archive/**'
      - 'artists.css'
      - 'artists.js'
      - 'archive.css'
      - 'archive.js'
      - 'event-types.css'
      - 'event-page.css'
      - 'event-runtime.js'
      - 'reservations.js'
      - 'script.js'
      - 'en/**'
      - 'zh-tw/**'
      - 'tests/**'
      - 'automation/event_utils.py'
      - 'automation/render_events.py'
      - 'automation/render_operating_schedule.py'
      - 'automation/render_artists.py'
      - 'automation/render_event_pages.py'
      - 'automation/render_archive.py'
      - 'automation/clean_generated.py'
      - 'automation/apply_brand_theme.py'
      - 'automation/event.schema.json'
      - 'automation/artist.schema.json'
      - '.github/workflows/event-pipeline.yml'
  push:
    branches: [main]
    paths:
      - 'data/events.json'
      - 'data/flyer_verifications.json'
      - 'data/website_image_baseline.json'
      - 'data/october_kiraku_migration.json'
      - 'data/publication_tombstones.json'
      - 'data/social_publications.json'
      - 'automation/publication_guard.py'
      - 'automation/audit_rendered_publication.py'
      - 'automation/social_package.py'
      - 'automation/config.json'
      - 'automation/import_legacy_events.py'
      - 'flyer_*'
      - 'data/artists.json'
      - 'data/operations.json'
      - 'assets/flyers/**'
      - 'assets/brand/**'
      - 'brand-monochrome.css'
      - 'artists.css'
      - 'artists.js'
      - 'archive.css'
      - 'archive.js'
      - 'event-types.css'
      - 'event-page.css'
      - 'event-runtime.js'
      - 'reservations.js'
      - 'script.js'
      - 'en/**'
      - 'zh-tw/**'
      - 'tests/**'
      - 'automation/event_utils.py'
      - 'automation/render_events.py'
      - 'automation/render_operating_schedule.py'
      - 'automation/render_artists.py'
      - 'automation/render_event_pages.py'
      - 'automation/render_archive.py'
      - 'automation/clean_generated.py'
      - 'automation/apply_brand_theme.py'
      - 'automation/event.schema.json'
      - 'automation/artist.schema.json'
      - '.github/workflows/event-pipeline.yml'
  schedule:
    # 03:30 JST. By this time the previous local event day has fully ended, including DOLPHIN's late-night hours.
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test reservation dates and translation
        run: node --test tests/*.test.cjs

      - name: Audit flyer reviews and cancellation tombstones
        run: python automation/publication_guard.py > "$RUNNER_TEMP/flyer-publication-audit.json"

      - name: Render current and future schedule from EVENT database
        run: python automation/render_events.py

      - name: Render regular opening days and closures from operations data
        run: python automation/render_operating_schedule.py

      - name: Render artists archive
        run: python automation/render_artists.py

      - name: Render persistent event pages
        run: python automation/render_event_pages.py

      - name: Render LIVE ARCHIVE from the same EVENT database
        run: python automation/render_archive.py

      - name: Normalize generated markup
        run: python automation/clean_generated.py

      - name: Validate reservation options against event data
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Verify monochrome desktop and mobile
        if: github.event_name == 'pull_request'
        run: |
          npm install --prefix "$RUNNER_TEMP/dolphin-brand-qa" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/dolphin-brand-qa/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/dolphin-brand-qa/node_modules" node tests/brand_theme_browser.cjs

      - name: Save monochrome verification previews
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-monochrome-previews
          path: ${{ runner.temp }}/dolphin-theme-previews
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify rendered event media
        run: python automation/audit_rendered_publication.py

      - name: Save flyer publication hold report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyer-publication-audit
          path: ${{ runner.temp }}/flyer-publication-audit.json
          retention-days: 7

      - name: Validate rendered diff
        run: git diff --check

      - name: Commit generated views
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No generated view changes."
            exit 0
          fi
          git config user.name "dolphin-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "chore: render DOLPHIN schedule and live archive"
          git push
