name: DOLPHIN Content Pipeline

on:
  pull_request:
    paths:
      - 'data/events.json'
      - 'data/artists.json'
      - 'assets/flyers/**'
      - 'artists/**'
      - 'artists.css'
      - 'artists.js'
      - 'event-types.css'
      - 'automation/render_events.py'
      - 'automation/render_artists.py'
      - 'automation/clean_generated.py'
      - 'automation/event.schema.json'
      - 'automation/artist.schema.json'
      - '.github/workflows/event-pipeline.yml'
  push:
    branches: [main]
    paths:
      - 'data/events.json'
      - 'data/artists.json'
      - 'assets/flyers/**'
      - 'artists.css'
      - 'artists.js'
      - 'event-types.css'
      - 'automation/render_events.py'
      - 'automation/render_artists.py'
      - 'automation/clean_generated.py'
      - 'automation/event.schema.json'
      - 'automation/artist.schema.json'
      - '.github/workflows/event-pipeline.yml'
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render event schedule and badges
        run: python automation/render_events.py

      - name: Render artists archive and linked event pages
        run: python automation/render_artists.py

      - name: Normalize generated markup
        run: python automation/clean_generated.py

      - name: Validate rendered diff
        run: git diff --check

      - name: Commit rendered pages
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- index.html schedule.html archive.html artists events; then
            echo "No rendered page changes."
            exit 0
          fi
          git config user.name "dolphin-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html schedule.html archive.html artists events
          git commit -m "chore: render DOLPHIN content from structured data"
          git push
