name: DOLPHIN Event Pipeline

on:
  pull_request:
    paths:
      - 'data/events.json'
      - 'assets/flyers/**'
      - 'automation/render_events.py'
      - '.github/workflows/event-pipeline.yml'
  push:
    branches: [main]
    paths:
      - 'data/events.json'
      - 'assets/flyers/**'
      - 'automation/render_events.py'
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render event pages
        run: python automation/render_events.py

      - name: Validate rendered diff
        run: git diff --check

      - name: Commit rendered pages
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- index.html schedule.html archive.html; then
            echo "No rendered page changes."
            exit 0
          fi
          git config user.name "dolphin-event-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html schedule.html archive.html
          git commit -m "chore: render event pages from event registry"
          git push
