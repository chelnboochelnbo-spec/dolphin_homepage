name: Enrich Legacy Schedule Content

on:
  push:
    branches: [fix/preserve-legacy-schedule-content]
    paths:
      - 'automation/enrich_legacy_schedule_content.py'
      - '.github/workflows/enrich-legacy-schedule.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/preserve-legacy-schedule-content
          fetch-depth: 0

      - name: Restore rich schedule facts into EVENT data
        run: python automation/enrich_legacy_schedule_content.py

      - name: Validate JSON and whitespace
        run: |
          python -m json.tool data/events.json > /dev/null
          git diff --check

      - name: Commit enriched EVENT data
        run: |
          if git diff --quiet -- data/events.json; then
            echo "No enrichment changes."
            exit 0
          fi
          git config user.name "dolphin-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          git commit -m "fix: preserve rich legacy schedule content"
          git push origin HEAD:fix/preserve-legacy-schedule-content
